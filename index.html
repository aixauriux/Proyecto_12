
<!DOCTYPE html>
<html lang="es">
<head>

    <title>Mundo Hámster</title>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>

    <main class="contenedor">

        <h1></h1>

        <p>
            Escribe algo sobre estos pequeños animalitos.

        <textarea id="mensaje" maxlength="250"

        <p id="estado"> 🐾</p>

    </main>
